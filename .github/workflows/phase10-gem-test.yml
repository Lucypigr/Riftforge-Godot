name: Phase 10 gem expansion regression
on:
  push:
    branches: [feature/phase10-gem-expansion]
  pull_request:
    branches: [fix/phase8-mobile-world-interaction]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Prepare licensed font and Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts "$HOME/.local/share/godot/export_templates" build/phase10
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          wget --quiet --tries=3 --timeout=45 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf' -O fonts/NotoSansTC.ttf
          wget --quiet --tries=3 --timeout=45 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/OFL.txt' -O fonts/OFL.txt
          test "$(stat -c%s fonts/NotoSansTC.ttf)" -gt 1000000

      - name: Godot import and reject parse errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' import.log; then exit 1; fi

      - name: Headless project startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' startup.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 8 compact inventory regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase3_inventory.gd 2>&1 | tee inventory.log
          grep -Eq '^PHASE3 INVENTORY: [1-9][0-9]* passed / 0 failed$' inventory.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' inventory.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 7 hotbar regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase7_hotbar.gd 2>&1 | tee phase7.log
          grep -Eq '^PHASE7 GEM HOTBAR: [1-9][0-9]* passed / 0 failed$' phase7.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' phase7.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 6 HUD regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase6_hud.gd 2>&1 | tee phase6.log
          grep -Eq '^PHASE6 ARPG HUD: [1-9][0-9]* passed / 0 failed$' phase6.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' phase6.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 5 weapon loot regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase5_weapon_loot.gd 2>&1 | tee phase5.log
          grep -Eq '^PHASE5 WEAPON LOOT: [1-9][0-9]* passed / 0 failed$' phase5.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' phase5.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 4 Combat V2 regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase4_combat_v2.gd 2>&1 | tee phase4.log
          grep -Eq '^PHASE4 COMBAT V2: [1-9][0-9]* passed / 0 failed$' phase4.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' phase4.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 2 skill feedback and multitouch regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase2_skill_core.gd 2>&1 | tee skill.log
          grep -Fq 'PHASE2 TEST RESULT: 20 passed / 0 failed' skill.log
          godot --headless --path . --script res://tests/test_phase2_cast_feedback.gd 2>&1 | tee feedback.log
          grep -Fq 'PHASE2 CAST FEEDBACK: 11 passed / 0 failed' feedback.log
          godot --headless --path . --script res://tests/test_phase2_multitouch.gd 2>&1 | tee touch.log
          grep -Fq 'PHASE2 MULTITOUCH: 9 passed / 0 failed' touch.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' skill.log feedback.log touch.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Mobile world interaction regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_mobile_world_interaction.gd 2>&1 | tee mobile-world.log
          grep -Fq 'MOBILE WORLD INTERACTION: 28 passed / 0 failed' mobile-world.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' mobile-world.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Phase 10 gem expansion regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_phase10_gem_expansion.gd 2>&1 | tee phase10.log
          grep -Eq '^PHASE10 GEM EXPANSION: [3-9][5-9] passed / 0 failed$|^PHASE10 GEM EXPANSION: [4-9][0-9] passed / 0 failed$|^PHASE10 GEM EXPANSION: [1-9][0-9][0-9]+ passed / 0 failed$' phase10.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' phase10.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Export playable Phase 10 Web build
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-release Web build/phase10/index.html 2>&1 | tee export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' export.log; then exit 1; fi
          test -s build/phase10/index.html
          test -n "$(find build/phase10 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/phase10 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE10 WEB EXPORT READY'
