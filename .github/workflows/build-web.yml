name: Build and deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  web:
    name: Export browser version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

      - name: Install provided export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          godot --version

      - name: Add licensed Traditional Chinese font for Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts
          curl --fail --location --show-error --silent --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf' \
            --output fonts/NotoSansTC.ttf
          curl --fail --location --show-error --silent --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/OFL.txt' \
            --output fonts/OFL.txt
          test "$(stat -c%s fonts/NotoSansTC.ttf)" -gt 1000000
          test -s fonts/OFL.txt

      - name: Import project and inspect errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Export Web (single-threaded)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -name '*.pck' -print -quit)"
          cp fonts/OFL.txt build/web/NOTO_FONT_LICENSE.txt

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: riftforge-web
          path: build/web/
          if-no-files-found: error

  deploy:
    name: Publish game on GitHub Pages
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exported game
        uses: actions/download-artifact@v4
        with:
          name: riftforge-web
          path: build/web/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package game for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
