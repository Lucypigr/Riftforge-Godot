          cp fonts/OFL.txt build/web/preview/phase6/NOTO_FONT_LICENSE.txt
          godot --headless --path phase6-src --editor --quit 2>&1 | tee /tmp/phase6-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase6-import.log; then exit 1; fi
          for spec in 'test_phase6_hud.gd|PHASE6 ARPG HUD:' 'test_phase5_weapon_loot.gd|PHASE5 WEAPON LOOT:' 'test_phase4_combat_v2.gd|PHASE4 COMBAT V2:' 'test_phase3_inventory.gd|PHASE3 INVENTORY:' 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_cast_feedback.gd|PHASE2 CAST FEEDBACK: 11 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase6-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase6-${script}.log"
            grep -Fq "$marker" "/tmp/phase6-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase6-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
            if [[ "$script" == test_phase6_hud.gd ]]; then grep -Eq '^PHASE6 ARPG HUD: 20 passed / 0 failed$' "/tmp/phase6-${script}.log"; fi
            if [[ "$script" == test_phase5_weapon_loot.gd ]]; then grep -Eq '^PHASE5 WEAPON LOOT: 24 passed / 0 failed$' "/tmp/phase6-${script}.log"; fi
            if [[ "$script" == test_phase4_combat_v2.gd ]]; then grep -Eq '^PHASE4 COMBAT V2: 30 passed / 0 failed$' "/tmp/phase6-${script}.log"; fi
            if [[ "$script" == test_phase3_inventory.gd ]]; then grep -Eq '^PHASE3 INVENTORY: 37 passed / 0 failed$' "/tmp/phase6-${script}.log"; fi
          done
          godot --headless --path phase6-src --export-release 'Web' "$GITHUB_WORKSPACE/build/web/preview/phase6/index.html" 2>&1 | tee /tmp/phase6-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase6-export.log; then exit 1; fi
          test -s build/web/preview/phase6/index.html
          test -n "$(find build/web/preview/phase6 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web/preview/phase6 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE6 PREVIEW READY INSIDE WEB ARTIFACT'

      - name: Checkout CI-verified Phase 7 gem hotbar experiment separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: be9144b1994f8f32c63480200a5f805d3089dcb1
          path: phase7-src
          persist-credentials: false

      - name: Test and export Phase 7 gem hotbar to isolated preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase7-src/fonts build/web/preview/phase7
          cp fonts/NotoSansTC.ttf phase7-src/fonts/NotoSansTC.ttf
          cp fonts/OFL.txt build/web/preview/phase7/NOTO_FONT_LICENSE.txt
          godot --headless --path phase7-src --editor --quit 2>&1 | tee /tmp/phase7-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase7-import.log; then exit 1; fi
          for spec in 'test_phase7_hotbar.gd|PHASE7 GEM HOTBAR:' 'test_phase6_hud.gd|PHASE6 ARPG HUD:' 'test_phase5_weapon_loot.gd|PHASE5 WEAPON LOOT:' 'test_phase4_combat_v2.gd|PHASE4 COMBAT V2:' 'test_phase3_inventory.gd|PHASE3 INVENTORY:' 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_cast_feedback.gd|PHASE2 CAST FEEDBACK: 11 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase7-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase7-${script}.log"
            grep -Fq "$marker" "/tmp/phase7-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase7-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
            if [[ "$script" == test_phase7_hotbar.gd ]]; then grep -Eq '^PHASE7 GEM HOTBAR: [1-9][0-9]* passed / 0 failed
        uses: actions/upload-artifact@v4
        with:
          name: riftforge-web
          path: build/web/
          if-no-files-found: error

  deploy:
    name: Publish stable game and isolated previews on GitHub Pages
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exported games
        uses: actions/download-artifact@v4
        with:
          name: riftforge-web
          path: build/web/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package games for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4 "/tmp/phase7-${script}.log"; fi
            if [[ "$script" == test_phase6_hud.gd ]]; then grep -Eq '^PHASE6 ARPG HUD: 20 passed / 0 failed
        uses: actions/upload-artifact@v4
        with:
          name: riftforge-web
          path: build/web/
          if-no-files-found: error

