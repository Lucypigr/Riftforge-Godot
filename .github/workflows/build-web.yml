        with:
          path: build/web/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4 "/tmp/phase7-${script}.log"; fi
            if [[ "$script" == test_phase4_combat_v2.gd ]]; then grep -Eq '^PHASE4 COMBAT V2: 30 passed / 0 failed
        uses: actions/upload-artifact@v4
        with:
          name: riftforge-web
          path: build/web/
          if-no-files-found: error

