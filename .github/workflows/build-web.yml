      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4 "/tmp/phase7-${script}.log"; fi
            if [[ "$script" == test_phase3_inventory.gd ]]; then grep -Eq '^PHASE3 INVENTORY: 37 passed / 0 failed
        uses: actions/upload-artifact@v4
