name: Build and deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  web:
    name: Export stable game and isolated Phase 2/3/4/5/6/7 previews
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout stable Godot project
        uses: actions/checkout@v4

      - name: Install provided export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          godot --version

      - name: Add licensed Traditional Chinese font for Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts
          wget --quiet --tries=3 --timeout=45 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf' \
            -O fonts/NotoSansTC.ttf
          wget --quiet --tries=3 --timeout=45 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/OFL.txt' \
            -O fonts/OFL.txt
          test "$(stat -c%s fonts/NotoSansTC.ttf)" -gt 1000000
          test -s fonts/OFL.txt

      - name: Import stable project and reject script errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/riftforge-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/riftforge-import.log; then exit 1; fi

      - name: Smoke test stable game startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/riftforge-startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/riftforge-startup.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Regression test stable mobile skill controls
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/test_mobile_inputs.gd 2>&1 | tee /tmp/riftforge-mobile.log
          grep -q 'MOBILE INPUT TEST PASSED: 9 checks' /tmp/riftforge-mobile.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/riftforge-mobile.log | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi

      - name: Export stable Web game at root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee /tmp/riftforge-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/riftforge-export.log; then exit 1; fi
          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -name '*.pck' -print -quit)"
          cp fonts/OFL.txt build/web/NOTO_FONT_LICENSE.txt

      - name: Checkout pinned Phase 2 experiment separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: 48269e22b68ef5cefea494c5f1ad6ccea3471f37
          path: phase2-src
          persist-credentials: false

      - name: Test and export Phase 2 to preview subdirectory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase2-src/fonts build/web/preview/phase2
          cp fonts/NotoSansTC.ttf phase2-src/fonts/NotoSansTC.ttf
          cp fonts/OFL.txt build/web/preview/phase2/NOTO_FONT_LICENSE.txt
          godot --headless --path phase2-src --editor --quit 2>&1 | tee /tmp/phase2-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase2-import.log; then exit 1; fi
          for spec in 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_integration.gd|PHASE2 INTEGRATION RESULT: 21 passed / 0 failed' 'test_phase2_cast_feedback.gd|PHASE2 CAST FEEDBACK: 11 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase2-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase2-${script}.log"
            grep -Fq "$marker" "/tmp/phase2-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase2-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
          done
          godot --headless --path phase2-src --export-release 'Web' "$GITHUB_WORKSPACE/build/web/preview/phase2/index.html" 2>&1 | tee /tmp/phase2-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase2-export.log; then exit 1; fi
          test -s build/web/preview/phase2/index.html
          test -n "$(find build/web/preview/phase2 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web/preview/phase2 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE2 PREVIEW READY INSIDE WEB ARTIFACT'

      - name: Checkout pinned Phase 3 inventory separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: 7e74db45e05944b4e6765a176fe6f3d63126280a
          path: phase3-src
          persist-credentials: false

      - name: Test and export Phase 3 to preview subdirectory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-src/fonts build/web/preview/phase3
          cp fonts/NotoSansTC.ttf phase3-src/fonts/NotoSansTC.ttf
          cp fonts/OFL.txt build/web/preview/phase3/NOTO_FONT_LICENSE.txt
          godot --headless --path phase3-src --editor --quit 2>&1 | tee /tmp/phase3-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase3-import.log; then exit 1; fi
          for spec in 'test_phase3_inventory.gd|PHASE3 INVENTORY:' 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase3-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase3-${script}.log"
            grep -Fq "$marker" "/tmp/phase3-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase3-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
            if grep -Eq '^PHASE3 INVENTORY: [1-9][0-9]* passed / 0 failed$' "/tmp/phase3-${script}.log"; then :; elif [[ "$script" == test_phase3_inventory.gd ]]; then exit 1; fi
          done
          godot --headless --path phase3-src --export-release 'Web' "$GITHUB_WORKSPACE/build/web/preview/phase3/index.html" 2>&1 | tee /tmp/phase3-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase3-export.log; then exit 1; fi
          test -s build/web/preview/phase3/index.html
          test -n "$(find build/web/preview/phase3 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web/preview/phase3 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE3 PREVIEW READY INSIDE WEB ARTIFACT'

      - name: Checkout verified Phase 4 combat experiment separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: 29f3532b459ef74ac51c296c7142f096d82ba48a
          path: phase4-src
          persist-credentials: false

      - name: Test and export Phase 4 combat to isolated preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4-src/fonts build/web/preview/phase4
          cp fonts/NotoSansTC.ttf phase4-src/fonts/NotoSansTC.ttf
          cp fonts/OFL.txt build/web/preview/phase4/NOTO_FONT_LICENSE.txt
          godot --headless --path phase4-src --editor --quit 2>&1 | tee /tmp/phase4-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase4-import.log; then exit 1; fi
          for spec in 'test_phase4_combat_v2.gd|PHASE4 COMBAT V2:' 'test_phase3_inventory.gd|PHASE3 INVENTORY:' 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_cast_feedback.gd|PHASE2 CAST FEEDBACK: 11 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase4-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase4-${script}.log"
            grep -Fq "$marker" "/tmp/phase4-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase4-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
            if [[ "$script" == test_phase4_combat_v2.gd ]]; then grep -Eq '^PHASE4 COMBAT V2: [1-9][0-9]* passed / 0 failed$' "/tmp/phase4-${script}.log"; fi
            if [[ "$script" == test_phase3_inventory.gd ]]; then grep -Eq '^PHASE3 INVENTORY: [1-9][0-9]* passed / 0 failed$' "/tmp/phase4-${script}.log"; fi
          done
          godot --headless --path phase4-src --export-release 'Web' "$GITHUB_WORKSPACE/build/web/preview/phase4/index.html" 2>&1 | tee /tmp/phase4-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase4-export.log; then exit 1; fi
          test -s build/web/preview/phase4/index.html
          test -n "$(find build/web/preview/phase4 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web/preview/phase4 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE4 PREVIEW READY INSIDE WEB ARTIFACT'

      - name: Checkout CI-verified Phase 5 weapon loot experiment separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: 31e40069d39bef38f731007f93c284bd8aa285bb
          path: phase5-src
          persist-credentials: false

      - name: Test and export Phase 5 weapon loot to isolated preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase5-src/fonts build/web/preview/phase5
          cp fonts/NotoSansTC.ttf phase5-src/fonts/NotoSansTC.ttf
          cp fonts/OFL.txt build/web/preview/phase5/NOTO_FONT_LICENSE.txt
          godot --headless --path phase5-src --editor --quit 2>&1 | tee /tmp/phase5-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase5-import.log; then exit 1; fi
          for spec in 'test_phase5_weapon_loot.gd|PHASE5 WEAPON LOOT:' 'test_phase4_combat_v2.gd|PHASE4 COMBAT V2:' 'test_phase3_inventory.gd|PHASE3 INVENTORY:' 'test_phase2_skill_core.gd|PHASE2 TEST RESULT: 20 passed / 0 failed' 'test_phase2_cast_feedback.gd|PHASE2 CAST FEEDBACK: 11 passed / 0 failed' 'test_phase2_multitouch.gd|PHASE2 MULTITOUCH: 9 passed / 0 failed'; do
            script="${spec%%|*}"
            marker="${spec#*|}"
            godot --headless --path phase5-src --script "res://tests/$script" 2>&1 | tee "/tmp/phase5-${script}.log"
            grep -Fq "$marker" "/tmp/phase5-${script}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL ' "/tmp/phase5-${script}.log" | grep -v 'ERROR: Parameter "m" is null.' | grep -q .; then exit 1; fi
            if [[ "$script" == test_phase5_weapon_loot.gd ]]; then grep -Eq '^PHASE5 WEAPON LOOT: [1-9][0-9]* passed / 0 failed$' "/tmp/phase5-${script}.log"; fi
            if [[ "$script" == test_phase4_combat_v2.gd ]]; then grep -Eq '^PHASE4 COMBAT V2: [1-9][0-9]* passed / 0 failed$' "/tmp/phase5-${script}.log"; fi
            if [[ "$script" == test_phase3_inventory.gd ]]; then grep -Eq '^PHASE3 INVENTORY: [1-9][0-9]* passed / 0 failed$' "/tmp/phase5-${script}.log"; fi
          done
          godot --headless --path phase5-src --export-release 'Web' "$GITHUB_WORKSPACE/build/web/preview/phase5/index.html" 2>&1 | tee /tmp/phase5-export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/phase5-export.log; then exit 1; fi
          test -s build/web/preview/phase5/index.html
          test -n "$(find build/web/preview/phase5 -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web/preview/phase5 -maxdepth 1 -name '*.pck' -print -quit)"
          echo 'PHASE5 PREVIEW READY INSIDE WEB ARTIFACT'

      - name: Checkout CI-verified Phase 6 HUD experiment separately (not merged)
        uses: actions/checkout@v4
        with:
          ref: bc98f09a7a7af2e25e73041c2506370f5409e6ed
